name: Preserve copyright and license notices
on: pull_request
permissions:
  contents: read
jobs:
  preserve-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check using the base branch policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:build/verify/preserve-notices.mjs" > "$RUNNER_TEMP/preserve-notices.mjs"
          node "$RUNNER_TEMP/preserve-notices.mjs" "$BASE_SHA" "$HEAD_SHA"
